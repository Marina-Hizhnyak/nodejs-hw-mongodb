tags:
  - Contacts
summary: Create contact
operationId: createContact
description: Create contact
security:
  - bearerAuth: []

requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
          - userId
        properties:
          name:
            type: string
            description: Contact name
            example: John Doe
          email:
            type: string
            format: email
            description: Contact email
            example: john@example.com
          phoneNumber:
            type: string
            description: Contact phone number
            example: +324012345667
          isFavourite:
            type: boolean
            description: Whether contact is marked as favourite
            example: false
          contactType:
            type: string
            description: Type of contact
            enum: [personal, work]
            example: personal
          photo:
            type: string
            format: binary
            description: Contact photo to upload
responses:
  '201':
    description: Contact created successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact created successfully
            data:
              $ref: ../../components/schemas/contactPost.yaml
  '400':
    $ref: ../../components/responses/400.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
