tags:
  - Contacts
summary: Get contacts list
operationId: getContacts
description: Returns a paginated list of contacts for the authenticated user.
security:
  - bearerAuth: []

parameters:
  - in: query
    name: page
    description: Page number (starts at 1)
    schema: { type: integer, minimum: 1, default: 1 }
  - in: query
    name: perPage
    description: Items per page
    schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  - in: query
    name: sortBy
    description: Field to sort by
    schema:
      type: string
      enum: [name, email, createdAt]
      default: createdAt
  - in: query
    name: sortOrder
    description: Sort direction
    schema:
      type: string
      enum: [asc, desc]
      default: asc
  - in: query
    name: isFavourite
    description: Filter by favourite flag
    schema: { type: boolean }

responses:
  '200':
    description: Successfully found contacts
    content:
      application/json:
        schema:
          type: object
          required: [status, message, data]
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - total
                - page
                - perPage
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/contact.yaml
                total:
                  type: integer
                  example: 134
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 20
                totalPages:
                  type: integer
                  example: 7
                hasNextPage:
                  type: boolean
                  example: true
                hasPreviousPage:
                  type: boolean
                  example: false
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
