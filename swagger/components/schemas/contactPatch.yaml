type: object
additionalProperties: false
minProperties: 1
properties:
  name:
    type: string
    description: Contact name
    example: John Doe

  email:
    type: string
    format: email
    description: Contact email
    example: john@example.com

  phoneNumber:
    type: string
    description: Contact phone number
    example: +324012345667

  isFavourite:
    type: boolean
    description: Whether contact is marked as favourite
    example: true

  contactType:
    type: string
    description: Type of contact
    enum: [personal, work]
    example: work

  photo:
    type: string
    format: binary
    description: New contact photo to upload
