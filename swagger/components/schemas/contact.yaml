type: object
required:
  - _id
  - name
  - phoneNumber
  - email
  - isFavourite
  - contactType
  - photo
  - userId
  - createdAt
  - updatedAt
properties:
  _id:
    type: string
    description: Contact id
    example: 68efd41636a23320bb4ef586
  name:
    type: string
    description: Contact name
    example: John Deere
  phoneNumber:
    type: string
    description: Contact phone number
    example: +324012345667
  email:
    type: string
    description: Contact email
    example: 123@gmail.com
  isFavourite:
    type: boolean
    default: false
    description: Contact is favourite
    example: true
  contactType:
    type: string
    description: Type of contact
    default: personal
    example: work
  photo:
    type:
      - string
      - 'null'
    description: Contact photo
    example: https://res.cloudinary.com/dhu1d3tbu/image/upload/v1760732861/tu48nwwlwfaf0he8jpjw.jpg
  userId:
    type: string
    description: Contact owner id
    example: 68efd834f1781f960b1e7a6c
  createdAt:
    type: string
    format: date-time
    example: 2025-10-08T18:21:10.157+00:00
  updatedAt:
    type: string
    format: date-time
    example: 2025-10-08T18:21:10.157+00:00
