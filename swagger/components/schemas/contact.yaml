type: object
required:
  - _id
  - name
  - phoneNumber
  - email
  - isFavourite
  - contactType
  - photo
  - userId
  - createdAt
  - updatedAt
properties:
  _id:
    type: string
    description: Contact id
    example: '68efd41636a23320bb4ef586'
    readOnly: true
  name:
    type: string
    description: Contact name
    example: 'John Deere'
  phoneNumber:
    type: string
    description: Contact phone number
    example: '+324012345667'
  email:
    type: string
    format: email
    description: Contact email
    example: '123@gmail.com'
  isFavourite:
    type: boolean
    description: Contact is favourite
    example: true
  contactType:
    type: string
    description: Type of contact
    example: 'work'
    default: 'personal'
  photo:
    type: string
    format: uri
    nullable: true
    description: Public URL of the contact photo
    example: 'https://res.cloudinary.com/.../image.jpg'
  userId:
    type: string
    description: Contact owner id
    example: '68efd834f1781f960b1e7a6c'
    readOnly: true
  createdAt:
    type: string
    format: date-time
    example: '2025-10-08T18:21:10.157Z'
    readOnly: true
  updatedAt:
    type: string
    format: date-time
    example: '2025-10-08T18:21:10.157Z'
    readOnly: true
additionalProperties: false
