type: object
properties:
  name: { type: string, example: 'John Doe' }
  email: { type: string, format: email, example: 'john@example.com' }
  phoneNumber: { type: string, example: '+324012345667' }
  isFavourite:
    oneOf:
      - type: boolean
      - type: string
        enum: ['true', 'false']
    example: true
  contactType: { type: string, example: 'work' }
  photo:
    type: string
    format: binary
    description: New contact photo to upload
additionalProperties: false
